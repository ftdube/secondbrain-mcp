# Grouped and monthly on purpose. Required approvals is 1 with no bypass, so every
# Dependabot pull request costs a human approval. One grouped pull request per
# ecosystem per month is a review; one per dependency per week is a rubber stamp.
#
# If the approval load ever feels like a chore, that is the signal this file is
# wrong -- not the gate.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directories:
      - /
      - /sidecars
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
    open-pull-requests-limit: 1
