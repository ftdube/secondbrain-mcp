# Grouped and monthly on purpose. Required approvals is 1 with no bypass, so every
# Dependabot pull request costs a human approval. One grouped pull request per
# ecosystem per month is a review; one per dependency per week is a rubber stamp.
#
# Majors are split into their own group. A single group holding everything means
# one breaking major blocks every safe update behind it -- which is exactly what
# happened when TypeScript 7 arrived bundled with a tsx patch.
#
# If the approval load ever feels like a chore, that is the signal this file is
# wrong -- not the gate.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:
        patterns: ["*"]
        update-types: ["major"]
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directories:
      - /
      - /sidecars
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      images-major:
        patterns: ["*"]
        update-types: ["major"]
    open-pull-requests-limit: 2
