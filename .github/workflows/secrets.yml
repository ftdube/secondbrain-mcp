name: Secrets

# Its own workflow so it can run on every branch push, which ci.yml cannot
# without also building images. Docs-only changes included: no path filter.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every commit, so the scan below sees all of history
          # The scanner image gets the whole checkout; it needs no token.
          persist-credentials: false
      # The CLI, not gitleaks-action: the action scans only the event's commit
      # range, and a secret anywhere in history is leaked, not just in this PR.
      # Read-only, no network, pinned by digest: a compromised or retagged image
      # can neither alter the checkout nor send anything out.
      - run: >-
          docker run --rm --network none -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose
